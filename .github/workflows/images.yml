# ドライブの絵を取り出して、サイト用に小さくして保存する(手動で動かす)
name: 絵を取り込む
on:
  workflow_dispatch:
permissions:
  contents: write
# 2回同時に動かさない（前の回が終わってから次の回を始める）
concurrency:
  group: images
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow "opencv-python-headless<5" numpy
      - run: python tools/fetch_images.py
      - run: python tools/make_bust.py
      - run: python tools/make_mosaic.py
      - name: 変わったものを保存
        run: |
          git config user.name "ishiken-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data img
          git diff --cached --quiet && exit 0
          git commit -m "ドライブの絵を取り込み"
          # ほかの作業が先に保存していたら、それを取り込んでから保存し直す（3回まで）
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
